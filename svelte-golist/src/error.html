<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Error - GoList</title>
		<style>
			body {
				font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
				margin: 0;
				padding: 2rem;
				background: linear-gradient(135deg, #1976D2, #42A5F5);
				color: white;
				min-height: 100vh;
				display: flex;
				align-items: center;
				justify-content: center;
				text-align: center;
			}
			.error-container {
				max-width: 400px;
			}
			h1 {
				font-size: 2rem;
				margin-bottom: 1rem;
			}
			p {
				font-size: 1.1rem;
				opacity: 0.9;
				line-height: 1.5;
			}
			.reload-button {
				background: rgba(255, 255, 255, 0.2);
				border: 2px solid white;
				color: white;
				padding: 12px 24px;
				border-radius: 8px;
				cursor: pointer;
				font-size: 16px;
				margin-top: 2rem;
				transition: all 0.2s ease;
			}
			.reload-button:hover {
				background: rgba(255, 255, 255, 0.3);
			}
		</style>
	</head>
	<body>
		<div class="error-container">
			<h1>Oops! Something went wrong</h1>
			<p>GoList encountered an unexpected error. This might be a temporary issue.</p>
			<button class="reload-button" onclick="window.location.reload()">
				Reload App
			</button>
		</div>
	</body>
</html>
